name: Actualizar datos de YouTube
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-data-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-static.txt
      - run: python -m pip install -r requirements-static.txt
      - name: Consultar YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SEARCH_TERMS: curiosidades;historias de terror;inteligencia artificial;datos interesantes;gaming;recetas;fitness
        run: python src/collect_static.py
      - name: Guardar datos públicos
        run: |
          git config user.name 'radar-viral[bot]'
          git config user.email 'radar-viral[bot]@users.noreply.github.com'
          git add data/live.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public YouTube metrics'
          git push origin HEAD:main
