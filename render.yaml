# Free static hosting. No database, paid disk or background worker.
services:
  - type: web
    name: radar-viral
    runtime: static
    repo: https://github.com/BynelsonDa/radar-viral
    branch: main
    buildCommand: python3 src/build_static_site.py
    staticPublishPath: public
    autoDeployTrigger: commit
    headers:
      - path: /data/*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
